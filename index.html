<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login-page">

    <div class="login-box">

        <h1>🎂 Happy Birthday</h1>

        <p>Masukkan Password</p>

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="checkPassword()">
            Masuk ❤️
        </button>

        <p id="error"></p>

    </div>

</div>

<!-- HALAMAN UTAMA -->
<div id="main-page">

    <div class="hero">

        <h1>Happy Birthday Ayla ❤️</h1>

        <p>
            Ada hadiah kecil buat kamu...
        </p>

        <button id="giftButton">
            🎁 Buka Hadiah
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
